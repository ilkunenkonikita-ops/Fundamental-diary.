<style>
/* Layout: big day counter, a scrolling strip of day squares that fill with colour as the foundation gets done, the foundation checklist, then the user's own categories. One dark "circuit board" look by choice. Every colour except the warm progress steps and the frost is derived from --accent, so changing --accent recolours the whole app. */
:root {
  color-scheme: dark;
  --accent: #3FE0A0;
  --mask: var(--accent);
  --bg: color-mix(in srgb, var(--accent) 3%, #050706);
  --surface: color-mix(in srgb, var(--accent) 7%, #0B0E0D);
  --surface-2: color-mix(in srgb, var(--accent) 11%, #0F1311);
  --line: color-mix(in srgb, var(--accent) 12%, #1C201F);
  --fg: color-mix(in srgb, var(--accent) 6%, #E8ECEB);
  --fg-2: color-mix(in srgb, var(--accent) 14%, #8D9694);
  --ink-on-fill: color-mix(in srgb, var(--accent) 10%, #050706);
  --glow-deep: color-mix(in srgb, var(--accent) 30%, #060C09);
  --lvl1: #C47A47;
  --lvl2: #C9A24A;
  --lvl3: color-mix(in srgb, var(--accent) 60%, var(--lvl2));
  --lvl4: var(--accent);
  --copper: #E39A63;
  --red: #F28068;
  --ice: #9FD6FF;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
}
/* Background: soft glow from the top, static. On mouse devices a second soft glow follows the cursor. */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -10%, var(--glow-deep) 0%, transparent 72%), linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 55%, #000));
}
.glow {
  display: none; position: fixed; left: 0; top: 0; width: 640px; height: 640px; margin: -320px 0 0 -320px;
  border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .5s; will-change: transform;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 17%, transparent) 0%, color-mix(in srgb, var(--accent) 7%, transparent) 35%, transparent 66%);
}
#bgGlow { z-index: -1; }
.glow.on { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .glow { display: block; } }

button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mask); outline-offset: 3px; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 22px 56px; }
#app { display: flex; flex-direction: column; gap: 26px; }
.pad { padding-inline: 16px; }
.lab { font-family: var(--sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-2); }

.boot { display: flex; align-items: center; gap: 12px; color: var(--fg-2); font-family: var(--sans); font-size: 13px; padding-block: 40px; }
.boot i { width: 10px; height: 10px; border-radius: 3px; background: var(--mask); animation: blink 1.1s ease-in-out infinite; }
.boot i:nth-child(2) { animation-delay: .15s; } .boot i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

/* head */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
textarea, input, select { font-family: var(--sans); }
.big { font-family: var(--sans); font-weight: 500; font-size: clamp(3.6rem, 19vw, 5.6rem); line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.big small { font-size: .28em; letter-spacing: .04em; color: var(--fg-2); font-weight: 400; margin-left: 10px; }
.head-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.date { font-size: 15px; color: var(--fg-2); text-transform: capitalize; text-align: right; }
/* the buttons always start at the left edge of the header block, whatever the width of the date above them */
.head-btns { display: flex; gap: 8px; align-items: center; align-self: flex-start; }
.jump, .btn {
  font-family: var(--sans); font-size: 13px; background: none; border: 1px solid var(--line); border-radius: 8px;
  min-height: 40px; padding: 0 14px; color: var(--fg);
}
.jump:hover, .btn:hover { border-color: var(--mask); color: var(--mask); }
/* on today the jump button is only invisible, not removed, so the other header buttons keep their places */
.head-btns .jump[hidden] { display: inline-flex; visibility: hidden; pointer-events: none; }
.btn.go { background: var(--mask); border-color: var(--mask); color: var(--ink-on-fill); font-weight: 600; }
.btn.go:hover { color: var(--ink-on-fill); filter: brightness(1.08); }
.btn.big { min-height: 52px; width: 100%; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: default; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.iconbtn:hover { border-color: var(--mask); color: var(--mask); }
.iconbtn svg { width: 20px; height: 20px; }
/* press feedback on buttons: a light squeeze, no bounce */
.btn, .iconbtn, .jump, .closeday, .dots, .ic, .icbtn { transition: transform .12s ease, border-color .25s, color .25s, background-color .25s; }
.btn:active, .iconbtn:active, .jump:active, .closeday:active, .dots:active, .ic:active, .icbtn:active { transform: scale(.96); }

.notice { border: 1px solid var(--copper); border-radius: 8px; padding: 10px 12px; font-size: 14px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.prestart { border: 1px dashed var(--line); border-radius: 12px; padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; }
.prestart b { font-family: var(--sans); font-weight: 500; font-size: 1.6rem; }

/* strip */
.strip {
  display: flex; gap: 10px; overflow-x: auto; padding: 16px 16px 14px;
  scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.cell { position: relative; flex: none; scroll-snap-align: center; }
.sq {
  position: relative; display: block; width: 64px; height: 76px; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left;
  transition: transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .4s, border-color .3s;
}
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--lvl4); transition: height .7s cubic-bezier(.3,.9,.3,1); }
.fill::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: color-mix(in srgb, #fff 55%, transparent); }
.num { position: absolute; top: 8px; left: 10px; font-family: var(--sans); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fg); transition: color .3s; }
.dt { position: absolute; bottom: 7px; left: 10px; font-family: var(--sans); font-size: 10px; letter-spacing: .04em; color: var(--fg-2); transition: color .3s; }
.cell[data-lvl="2"] .dt, .cell[data-lvl="3"] .dt, .cell[data-lvl="4"] .dt { color: var(--ink-on-fill); }
.cell[data-lvl="3"] .num, .cell[data-lvl="4"] .num { color: var(--ink-on-fill); }
.cell[data-lvl="4"] .sq { border-color: var(--lvl4); box-shadow: 0 0 18px color-mix(in srgb, var(--lvl4) 38%, transparent); }
.cell.today .sq { border-color: var(--mask); }
/* a day with no planned items: an empty square with a dashed outline, neither done nor missed */
.cell.free .sq { border-style: dashed; }
.dchip { flex: 1 1 0; min-width: 0; height: 36px; padding: 0; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--fg-2); font: inherit; font-size: 13px; cursor: pointer; transition: background-color .25s, color .25s, border-color .25s, transform .12s ease; }
.dchip:active { transform: scale(.94); }
.dchip.on { background: var(--mask); border-color: var(--mask); color: var(--ink-on-fill); }
.srow.fdays { gap: 4px; }
/* missed share of the day: a red band right above the done fill, its height is the share of missed items */
.mfill { position: absolute; left: 0; right: 0; height: 0%; background: var(--red); transition: height .7s cubic-bezier(.3,.9,.3,1); }
.cell.sel .sq { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.cell.sel[data-lvl="4"] .sq { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg), 0 0 20px color-mix(in srgb, var(--lvl4) 40%, transparent); }
.cell.frozen .sq { border-color: color-mix(in srgb, var(--ice) 80%, transparent); }
.cell.frozen .sq::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(135deg, rgba(190, 232, 255, .30) 0%, rgba(190, 232, 255, .06) 38%, rgba(190, 232, 255, 0) 56%, rgba(190, 232, 255, .22) 100%),
    repeating-linear-gradient(60deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 7px);
  box-shadow: inset 0 0 12px rgba(160, 215, 255, .38);
}
.cell.just .sq::after { animation: frostIn .9s ease-out; }
/* the accent colour can be animated, so a colour change glides instead of jumping */
@property --accent { syntax: '<color>'; inherits: true; initial-value: #3FE0A0; }
html.recolor { transition: --accent 1s cubic-bezier(.2, .8, .3, 1); }
/* closing a day: a blue glow rises from the edges of the screen, holds, then fades out */
.frost { position: fixed; inset: 0; pointer-events: none; z-index: 60; will-change: opacity; animation: frostOut .8s ease-in 2.1s forwards; }
.frost::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(150, 220, 255, 0) 30%, rgba(150, 220, 255, .42) 100%); animation: frostTint 2.4s ease-out both; }
@keyframes frostTint { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: .85; } }
@keyframes frostOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes frostIn { from { clip-path: circle(0% at 50% 100%); opacity: 0; } to { clip-path: circle(150% at 50% 100%); opacity: 1; } }
.link { position: absolute; top: 50%; right: -10px; width: 10px; height: 2px; background: var(--lvl4); opacity: 0; transition: opacity .4s .2s; pointer-events: none; }
.cell.linked .link { opacity: 1; }
.cell.pop .sq { animation: pop .55s cubic-bezier(.2,.8,.3,1.3); }
.cell.pop::before { content: ''; position: absolute; inset: 0; border-radius: 12px; z-index: 1; border: 2px solid var(--lvl4); animation: ring .8s ease-out forwards; pointer-events: none; }
/* the individual scale property, so the pop adds to the lifted look of a selected square instead of replacing it (that replacement was the jerk) */
@keyframes pop { 0% { scale: 1; } 40% { scale: 1.14; } 100% { scale: 1; } }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.32); opacity: 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 26%, transparent); } }
.cell.today:not(.sel):not([data-lvl="4"]):not(.frozen) .sq { animation: pulse 2.6s ease-in-out infinite; }

/* sections and lists */
[hidden] { display: none !important; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.acc-head, .sec-head.cat-tog { padding-top: 12px; padding-bottom: 10px; }
.acc-head .sec-meta { margin-right: auto; }
.cat-tog, .acc-head { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cat-chev { flex: none; width: 16px; height: 16px; align-self: center; fill: none; stroke: var(--fg-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s cubic-bezier(.3, .7, .2, 1); }
.cat-chev.shut { transform: rotate(-90deg); }
/* closing a day: the categories come back one after another, rising a little into place */
@keyframes catIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
body.cat-in #tSec .cat { animation: catIn .5s cubic-bezier(.2, .8, .3, 1) both; }
body.cat-in #tSec .cat:nth-child(2) { animation-delay: .08s; }
body.cat-in #tSec .cat:nth-child(3) { animation-delay: .16s; }
body.cat-in #tSec .cat:nth-child(4) { animation-delay: .24s; }
body.cat-in #tSec .cat:nth-child(n+5) { animation-delay: .32s; }
@media (prefers-reduced-motion: reduce) { body.cat-in #tSec .cat { animation: none; } }
h2 { margin: 0; font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; overflow-wrap: anywhere; }
.sec-meta { font-family: var(--sans); font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* a category finished for the day: its count glows in the accent colour */
.sec-meta.all { color: var(--mask); text-shadow: 0 0 10px color-mix(in srgb, var(--mask) 55%, transparent); }
/* the moment a category becomes full: the count appears together with the title's accent glow (.82s, when the pill has gone) and pulses once */
@keyframes metaPop {
  0% { opacity: 0; transform: scale(.8); text-shadow: 0 0 0 transparent; }
  35% { opacity: 1; transform: scale(1.12); text-shadow: 0 0 14px var(--mask); }
  100% { opacity: 1; transform: none; text-shadow: 0 0 10px color-mix(in srgb, var(--mask) 55%, transparent); }
}
/* a category's "1 из 1" sits right in front of its arrow, not in the middle of the header */
.cat-tog .sec-meta { margin-left: auto; }
.sec-meta.pop { display: inline-block; animation: metaPop .7s ease-out .82s backwards; }
.sec-meta.pop.now { animation-delay: .05s; }
@media (prefers-reduced-motion: reduce) { .sec-meta.pop { animation: none; } }
.sec { display: flex; flex-direction: column; gap: 6px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cat { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.cat:last-child { margin-bottom: 0; }
.item {
  /* content is pinned to the top: the checkbox, text and "перенос" badge stay put when the title grows on open */
  display: flex; align-items: flex-start; gap: 14px; flex: 1; min-width: 0; min-height: 50px; text-align: left;
  background: none; border: 0; padding: 0 2px 12px;
}
.item:disabled { cursor: default; color: var(--fg); }
.item:not(:disabled):hover .box { border-color: var(--mask); }
.box {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center; transition: background-color .25s, border-color .25s, transform .15s ease;
}
.box svg { width: 18px; height: 18px; }
.item:active .box { transform: scale(.88); }
.box path { fill: none; stroke: var(--ink-on-fill); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; }
.item[aria-checked="true"] .box { background: var(--mask); border-color: var(--mask); }
.item[aria-checked="true"] .box path { stroke-dashoffset: 0; }
/* the tick starts fully transparent and fades up to full opacity while it is drawn */
.item.anim[aria-checked="true"] .box path { animation: draw .35s ease-out .05s backwards; }
@keyframes draw { from { stroke-dashoffset: 22; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
.box.x { border-color: var(--red); }
/* a finished step in the middle of a chain: a filled square, the tick is kept for the last step */
.item .box.mid path { display: none; }
.item.anim .box.mid { animation: midPop .4s cubic-bezier(.2,.8,.3,1); }
@keyframes midPop { 0% { transform: scale(.78); } 60% { transform: scale(1.1); } 100% { transform: none; } }
.box.x path { stroke: var(--red); stroke-dasharray: 11.4; stroke-dashoffset: 0; }
.item[data-st="x"] .txt { color: var(--fg-2); }
/* a missed item: the cross draws itself in, and a strike line runs left to right through the title (one line per text line) */
/* order: the outline turns red, then the first stroke is drawn, then the second */
.item.anim[data-st="x"] .box.x { animation: boxRed .25s ease backwards; }
@keyframes boxRed { from { border-color: var(--fg-2); } to { border-color: var(--red); } }
/* the outline and the first stroke start together; the second stroke starts only when the first has finished (.5s + .5s) */
.item.anim[data-st="x"] .box.x path.c1 { animation: drawX .25s ease-in-out backwards; }
.item.anim[data-st="x"] .box.x path.c2 { animation: drawX .25s ease-in-out .25s backwards; }
/* each stroke is 11.3 units long; a dash of the same length, pushed out of view, is drawn in (no pathLength, which some browsers ignore for dashes) */
@keyframes drawX { from { stroke-dashoffset: 11.4; } to { stroke-dashoffset: 0; } }
.item[data-st="x"] .ln {
  background-image: linear-gradient(to bottom, color-mix(in srgb, var(--red) 75%, transparent), color-mix(in srgb, var(--red) 75%, transparent));
  background-repeat: no-repeat; background-size: 100% 1.5px; background-position: 0 58%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* the strike starts only after the cross is fully drawn (both strokes end at .5s) */
.item.anim[data-st="x"] .ln { animation: strikeL .3s cubic-bezier(.4,0,.2,1) .5s backwards; }
@keyframes strikeL { from { background-size: 0% 1.5px; } to { background-size: 100% 1.5px; } }
/* the carry-over badge slides out to the right when the task is ticked; it shrinks to nothing, so the title grows into the space smoothly */
/* the carry-over pill first slides out to the right and fades (its space is kept, so the title does not move),
   then its space closes up, and the title comes back into that space */
/* the pill is fully gone by .5s, the moment the whole title is shown, so the two never change the line breaks at once */
.age.exit { overflow: hidden; white-space: nowrap; animation: ageOut .5s ease-in-out forwards; }
/* the cut title (with its "…") fades out while the pill leaves; once the pill has gone, the whole title fades in in its place */
.item .txt.exiting { animation: txtOut .2s ease-in forwards; }
@keyframes txtOut { from { opacity: 1; } to { opacity: 0; } }
.item .txt.full { display: block; overflow: visible; animation: txtAppear .7s ease-out; }
/* the finished title comes back in the accent colour with a soft glow, then settles to its normal done colour */
/* a finished foundation item: the same accent glow, without the fade-out before it */
/* overflow must be visible here too: the title box clips its own text-shadow otherwise, which is why the glow did not show */
.item .txt.glowin { animation: txtAppear .7s ease-out; }
.item .txt.stepin { animation: txtStepIn .6s cubic-bezier(.33,0,.25,1) .12s backwards; }
@keyframes txtStepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.item .txt.tglow { display: block; overflow: visible; animation: txtGlow .7s ease-out; }
/* a late item glows yellow instead of accent, title and icon alike; the icon settles to yellow */
.item.late[aria-checked="true"] .ico { color: #E8C35A; }
/* the icon is yellow in every frame (no accent start, so no blue flash); it only gets the same soft glow as the title */
.item.anim.late .ico { animation: icoLate .7s ease-out; }
@keyframes icoLate {
  0% { color: #E8C35A; filter: drop-shadow(0 0 8px color-mix(in srgb, #E8C35A 65%, transparent)); }
  60% { color: #E8C35A; filter: drop-shadow(0 0 6px color-mix(in srgb, #E8C35A 45%, transparent)); }
  100% { color: #E8C35A; filter: none; }
}
.item.late .txt.tglow { animation: txtGlowLate .7s ease-out; }
/* the actual time ("→ 10:30") in the corner slides in from below when it appears, and for a late item flashes yellow once */
/* the arrow and the actual time are part of the corner time; on completion the new part opens from zero width,
   so the planned time (right-aligned) glides left by exactly the space it needs */
.item .when { white-space: nowrap; }
/* inline-flex keeps the text on the same baseline as the time (an inline-block with overflow would sit on its bottom edge and drift up) */
.item .wat { display: inline-flex; overflow: hidden; white-space: pre; vertical-align: baseline; }
.item .wat.tick { animation: watOpen .55s cubic-bezier(.2,.7,.3,1) backwards; }
.item.late .wat.tick { animation: watOpenLate .55s cubic-bezier(.2,.7,.3,1) backwards; }
.item .wat.nudge { animation: whenIn .5s cubic-bezier(.2,.7,.3,1); }
.item.late .wat.nudge { animation: whenInLate .6s cubic-bezier(.2,.7,.3,1); }
@keyframes watOpen { from { max-width: 0; opacity: 0; } 35% { opacity: 1; } to { max-width: var(--w, 7em); opacity: 1; } }
@keyframes watOpenLate {
  from { max-width: 0; opacity: 0; color: #E8C35A; text-shadow: 0 0 10px color-mix(in srgb, #E8C35A 60%, transparent); }
  35% { opacity: 1; color: #E8C35A; text-shadow: 0 0 10px color-mix(in srgb, #E8C35A 60%, transparent); }
  to { max-width: var(--w, 7em); opacity: 1; color: #E8C35A; text-shadow: none; }
}
@keyframes whenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes whenInLate {
  0% { opacity: 0; transform: translateY(8px); color: #E8C35A; text-shadow: 0 0 10px color-mix(in srgb, #E8C35A 60%, transparent); }
  60% { opacity: 1; transform: none; color: #E8C35A; text-shadow: 0 0 8px color-mix(in srgb, #E8C35A 40%, transparent); }
  100% { opacity: 1; transform: none; color: #E8C35A; text-shadow: none; }
}
@keyframes txtGlowLate {
  0% { color: #E8C35A; text-shadow: 0 0 14px color-mix(in srgb, #E8C35A 65%, transparent); }
  60% { color: #E8C35A; text-shadow: 0 0 10px color-mix(in srgb, #E8C35A 45%, transparent); }
  100% { color: var(--fg-2); text-shadow: 0 0 0 transparent; }
}

.ipick { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding: 4px 0; }
/* the icon picker opened from a task gets a hairline above it, so it reads as a separate block */
/* the hairline ends where the last icon ends: the grid is as wide as its six columns */
/* the hairline above the grid draws in from the left, like the other opening animations */
.edit .ipick::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--line); transform-origin: left center; }
@keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.edit .ipick.fresh::before { animation: lineIn .5s cubic-bezier(.2,.8,.3,1) backwards; }
@media (prefers-reduced-motion: reduce) { .edit .ipick.fresh::before { animation: none; } }
/* the icon grid fans in one icon after another when the picture button opens it */

@media (prefers-reduced-motion: reduce) { .edit .ipick.fresh .ic { animation: none; } }
/* the grid opens by growing its height, so the rows below glide down instead of jumping */
/* padding and margin shrink with the height: otherwise the box stops at its padding and then snaps away */
@keyframes pickOpen { from { max-height: 0; padding-top: 0; margin-top: 0; opacity: 0; } to { max-height: 15em; padding-top: 12px; margin-top: 18px; opacity: 1; } }
.edit .ipick.fresh { animation: none; }
/* starts at the grid's real height, so the whole closing time is spent shrinking, not waiting */

.edit .ipick.closing { animation: pickClose .5s cubic-bezier(.4,0,.2,1) forwards; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .edit .ipick.fresh, .edit .ipick.closing { animation: none; overflow: visible; } }
.edit .ipick { margin-top: 18px; padding-top: 12px; position: relative; grid-template-columns: repeat(6, 44px); gap: 4px; justify-content: start; width: max-content; }
/* same size as the menu buttons above */

.igroup { grid-column: 1 / -1; font-family: var(--sans); font-size: 11px; color: var(--fg-2); padding: 8px 0 2px; letter-spacing: .04em; }

.ic {

/* freeze and hold buttons */

.hold {
  position: relative; overflow: hidden; min-height: 48px; border-radius: 10px; background: none; color: var(--fg); touch-action: none;
  border: 1px solid color-mix(in srgb, var(--ice) 45%, transparent); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;

/* sheets (30 days, settings) */

  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);

.mrow-h span:last-child { font-family: var(--sans); font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) { .srow.goalrow .tfield.bump { animation: none; } }
.srow .tbtn { display: inline-flex; align-items: center; justify-content: center; padding: 0; position: relative; overflow: hidden; }

/* the clock is not a delete button: hover and press light it in the accent colour, not red */

.acc-body { display: flex; flex-direction: column; }

@media (prefers-reduced-motion: reduce) { .srow.ent, .acc-body > .ent, .delpanel.ent { animation: none; } }

.file-btn { position: relative; overflow: hidden; align-self: flex-start; display: inline-flex; align-items: center; cursor: pointer; }

.sw {
  position: relative; width: 44px; height: 44px; border-radius: 10px; padding: 0; background: var(--c, var(--accent));
  border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
}

.sw.custom { background: conic-gradient(#ff6b6b, #ffd93d, #6bff95, #4dd4ff, #a78bfa, #ff6bd5, #ff6b6b); color: #07120C; font-weight: 700; cursor: pointer; }

/* first-run wizard */
.wiz {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto;
  background-color: var(--bg); background-image: radial-gradient(120% 60% at 50% -10%, var(--glow-deep) 0%, transparent 72%); background-repeat: no-repeat;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* assistant: floating mic and its sheet */
.botfab {

@keyframes recPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }

}

}
.item.late .when { color: #E8C35A; }

/* the time: the planned time sits in the corner; a grey clock under it opens the editor, which slides out beside the clock */
#fList li { position: relative; }

/* the clock slides out to the right while the time field is open, and slides back when it closes */

@keyframes tpFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes tpFadeOut { from { opacity: 1; } to { opacity: 0; } }
.tp-show { display: flex; justify-content: center; align-items: baseline; gap: 6px; margin-bottom: 14px; font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: var(--fg); }
.tp-sep { color: var(--fg-2); }
/* two drums: hours and minutes scroll and snap to the centre band */
.tp-cols { display: flex; gap: 12px; }
.tp-col { flex: 1; min-width: 0; position: relative; }
.tp-col::before, .tp-col::after { content: ''; position: absolute; left: 0; right: 0; height: 72px; z-index: 1; pointer-events: none; }
.tp-col::before { top: 0; background: linear-gradient(var(--surface), transparent); }
.tp-col::after { bottom: 0; background: linear-gradient(transparent, var(--surface)); }
.tp-band { position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-top: 1px solid var(--mask); border-bottom: 1px solid var(--mask); background: color-mix(in srgb, var(--mask) 8%, transparent); border-radius: 6px; pointer-events: none; z-index: 2; }
.tp-wheel { position: relative; height: 200px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; padding: 80px 0; }
.tp-wheel::-webkit-scrollbar { display: none; }
.tp-wi { height: 40px; line-height: 40px; text-align: center; scroll-snap-align: center; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--fg-2); opacity: .35; cursor: pointer; user-select: none; transition: opacity .15s, color .15s; }
.tp-wi.on { color: var(--fg); opacity: 1; font-weight: 600; }
.tp-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.tp-acts .btn { min-height: 40px; }
@media (prefers-reduced-motion: reduce) { .tp-back, .tp-card { animation: none; } }
/* the date picker: the same card, a month with its days */
.cl-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cl-title { font-size: 17px; font-weight: 600; color: var(--fg); }
.cl-nav { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--fg-2); font-size: 22px; line-height: 1; padding: 0; cursor: pointer; }
.cl-nav:hover { border-color: var(--mask); color: var(--mask); }
.cl-wd, .cl-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cl-wd { margin-bottom: 6px; text-align: center; font-size: 12px; color: var(--fg-2); }
.cl-grid.slide-l { animation: clSlideL .28s cubic-bezier(.2, .8, .3, 1) both; }
.cl-grid.slide-r { animation: clSlideR .28s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes clSlideL { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes clSlideR { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
.cl-d { height: 38px; padding: 0; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--fg); font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color .2s, border-color .2s, color .2s; }
.cl-d:hover { border-color: var(--mask); }
.cl-d.today { border-color: var(--line); color: var(--mask); }
.cl-d.on { background: var(--mask); border-color: var(--mask); color: var(--ink-on-fill); font-weight: 600; }
.cl-e { height: 38px; }
/* the colour card */
.cp-prev { height: 64px; border-radius: 12px; border: 1px solid var(--line); transition: background-color .15s; }
.cp-hex { text-align: center; margin: 8px 0 14px; font-family: var(--sans); font-size: 14px; color: var(--fg-2); }
.cp-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cp-row span { width: 104px; font-size: 14px; color: var(--fg-2); }
.cp-r { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 12px; border-radius: 6px; border: 1px solid var(--line); outline: none; }
.cp-r::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); cursor: pointer; }
.cp-r::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); cursor: pointer; }
.goal { margin: 0 0 8px; font-size: 14px; color: var(--fg-2); }
/* the day note: same sans type and surface as the rest of the app, not the browser's default monospace box */
.note textarea {
  display: block; width: 100%; min-height: 104px; resize: none; overflow: hidden;
  font-family: var(--sans); font-size: 16px; line-height: 1.5;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--fg);
}
.note textarea::placeholder { color: var(--fg-2); opacity: .8; }
.note textarea:focus { border-color: var(--mask); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.note textarea[readonly] { color: var(--fg-2); }
/* collapse: the body animates its height to zero instead of snapping */
.note .cat-chev { margin-left: auto; }
.note { transition: gap .5s cubic-bezier(.4,0,.2,1); }
.note.collapsed { gap: 0; }
.nbody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .5s cubic-bezier(.4,0,.2,1), opacity .4s ease; }
.nin { min-height: 0; overflow: hidden; }
.note.collapsed .nbody { grid-template-rows: 0fr; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .nbody { transition: none; } }
.fin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.fin-list li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; }
.fin-list li.no { color: var(--fg-2); }
.fin-list .dt { position: static; left: auto; bottom: auto; font-family: var(--sans); font-size: 12px; color: var(--fg-2); white-space: nowrap; min-width: 46px; }
.lfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #E8C35A; transition: height .7s cubic-bezier(.3,.9,.3,1), bottom .7s cubic-bezier(.3,.9,.3,1); }
.item .box.late { background: #E8C35A; border-color: #E8C35A; }
.mrow i.late { background: #E8C35A; }
.wiz-welcome { display: flex; flex-direction: column; gap: 28px; margin-top: 16vh; flex: 1; }
.wiz-help { position: absolute; inset: 0; z-index: 5; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.wiz-help > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
#wGoal { min-height: 90px; resize: vertical; }
.startfx { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; animation: fxIn .3s ease-out both; transition: opacity .6s ease; }
.startfx.out { opacity: 0; }
.startfx-sq { width: 150px; height: 180px; border-radius: 22px; border: 2px solid var(--accent); box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 10px; animation: fxSq 1.8s cubic-bezier(.2,.8,.3,1) both; }
.startfx-num { font-family: var(--sans); font-size: 26px; font-weight: 600; letter-spacing: 0; color: var(--accent); white-space: nowrap; opacity: 0; animation: fxNum .5s ease-out 1s forwards; }
@keyframes fxIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fxSq { from { transform: scale(.6); opacity: 0; } 40% { transform: scale(1); opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes fxNum { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.intro { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
.intro.out { opacity: 0; pointer-events: none; }
.intro-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.intro-wrap { transition: filter .5s ease; }
.intro.out .intro-wrap { filter: blur(12px); }
.intro-mask { width: min(62vw, 420px); overflow: hidden; }
.intro-logo { width: 100%; height: auto; display: block; transform: translateY(101%); will-change: transform; animation: introUp .9s cubic-bezier(.3,.7,.2,1) .15s forwards; }
.intro-sub { align-self: flex-start; font-family: var(--sans); font-weight: 300; font-size: 15px; letter-spacing: .16em; color: rgba(255,255,255,.72); opacity: 0; animation: introSub .6s ease 1.05s forwards; }
.intro.still .intro-logo { transform: none; animation: none; }
.intro.still .intro-sub { opacity: 1; animation: none; }
@keyframes introUp { to { transform: translateY(0); } }
@keyframes introSub { to { opacity: 1; } }
</style>

  function buildMonth() {
    var N = goalOf().days, t = todayKey(), keys = [];

    // the grid's columns are weekdays, starting from the weekday of day 1; each row is one week
    var DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'], w0 = new Date(cfg.start + 'T12:00:00').getDay();
    for (var wi = 0; wi < 7; wi++) { var dh = document.createElement('div'); dh.className = 'mdow'; dh.textContent = DOW[(w0 + wi) % 7]; g.appendChild(dh); }
    keys.forEach(function (k, j) {
      var info = dayInfo(k), d = days[k];
      var cell = document.createElement('div');
      cell.className = 'cell' + (k === todayKey() ? ' today' : '') + (isFrozen(k) ? ' frozen' : '') + (k > t ? ' future' : '') + (info.total === 0 ? ' free' : '');
      cell.dataset.lvl = String(info.lvl);
      cell.innerHTML = '<button type="button" class="sq"><span class="fill"></span><span class="lfill"></span><span class="mfill"></span><span class="num"></span><span class="dt"></span></button>';
      cell.querySelector('.num').textContent = dayNo(k);
      cell.querySelector('.dt').textContent = fmtShort(k);
      var sq = cell.querySelector('.sq');
      sq.setAttribute('aria-label', 'День ' + dayNo(k) + ', выполнено ' + info.done + ' из ' + info.total);
      var mPct = info.total ? (Object.keys((d && d.miss) || {}).length / info.total) * 100 : 0;
      var mfe = cell.querySelector('.mfill'), mt = Math.min(mPct, 100 - info.pct) + '%';
      mfe.style.bottom = info.pct + '%';
      if (reduce) mfe.style.height = mt; else { mfe.style.height = '0%'; setTimeout(function () { mfe.style.height = mt; }, 250 + j * 25); }
      sq.addEventListener('click', function () { closeSheet(); setView(k, true); });
      var f = cell.querySelector('.fill');
      var target = info.pct + '%';
      if (reduce) f.style.height = target; else { f.style.height = '0%'; setTimeout(function () { f.style.height = target; }, 250 + j * 25); }
      var lf = cell.querySelector('.lfill'), lt = info.latePct + '%';
      lf.style.bottom = info.onPct + '%';
      if (reduce) lf.style.height = lt; else { lf.style.height = '0%'; setTimeout(function () { lf.style.height = lt; }, 250 + j * 25); }
      g.appendChild(cell);
    });
    var rows = $('#mrows');
    rows.innerHTML = '';
    var items = cfg.foundation.filter(function (f) { return keys.some(function (k) { return f.from <= k && (!f.to || k <= f.to); }); });
    items.forEach(function (f) {
      var cnt = 0, total = 0, cells = '';
      keys.forEach(function (k, ki) {
        var sn = snapOf(k), act = f.from <= k && (!f.to || k <= f.to) && (sn ? sn.f.some(function (x) { return x.id === f.id; }) : wdOk(f, k));
        var wk = ''; if (ki % 7 === 0) cells += (ki ? '</div>' : '') + '<div class="wkg">';

        var dd = dayDoc(k), lt = isLateItem(dd, f), on = !!(dd.done && dd.done[f.id]) && !lt;

  // runs one action, returns a short human result

  function botAsk(raw) {

  function botMic() {

  // ---------- import: a file with history replaces all data ----------
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function parseImport(o) {
    // the app's own copy ("Скачать копию") has config, days and tasks in its internal shape: restore it as is
    if (o && typeof o === 'object' && o.config && typeof o.config === 'object' && o.days && o.tasks && !o.foundation) {
      var ec = o.config;
      if (!Array.isArray(ec.foundation) || !ec.foundation.length) throw new Error('в файле нет пунктов фундамента');
      return {
        next: { cfg: ec, days: o.days, tasks: o.tasks },
        summary: 'Дней: ' + Object.keys(o.days).length + ', задач: ' + Object.keys(o.tasks).length + ', пунктов фундамента: ' + ec.foundation.length + ', категорий: ' + (Array.isArray(ec.categories) ? ec.categories.length : 0) + '. Проверь и зажми кнопку ниже.'
      };
    }

    var fId = {}, cId = {};
    fl.forEach(function (f) {
      var title = String(f.title || '').trim().slice(0, 80);
      if (!title) return;
      var item = { id: uid(), title: title, time: TIME_RE.test(f.time) ? f.time : '', from: o.start, to: null };
      if (f.icon && Object.prototype.hasOwnProperty.call(ICONS, f.icon)) item.icon = f.icon;
      fId[title] = item.id;
      c.foundation.push(item);
    });
    (Array.isArray(o.categories) ? o.categories : []).slice(0, MAXC).forEach(function (x) {
      var title = String(x.title || '').trim().slice(0, 40);
      if (!title) return;
      var id = uid(); cId[title] = id;
      c.categories.push({ id: id, title: title });
    });

      var atIn = day.at && typeof day.at === 'object' ? day.at : {}, at = {};
      Object.keys(atIn).forEach(function (title) { if (fId[title] && done[fId[title]] && TIME_RE.test(atIn[title])) at[fId[title]] = atIn[title]; });
      nd[k] = { done: done, frozen: true, thawed: false, miss: miss, at: at, note: typeof day.note === 'string' ? day.note.slice(0, 5000) : '' };
      (Array.isArray(day.tasks) ? day.tasks : []).forEach(function (t) {
        var title = String(t.title || '').trim().slice(0, 200);
        if (!title) return;
        var on = DATE_RE.test(t.doneOn) && t.doneOn >= k && t.doneOn < t0 ? t.doneOn : null;
        var rec = { title: title, cat: cId[t.category] || '', born: k, doneDay: on, doneAt: on ? Date.parse(on + 'T12:00:00') : null, at: ++n };

    };
  }
  function readImport(file) {
    if (!file) return;

      catch (e) { sset.imp = null; sset.msg = 'Не получилось прочитать файл: ' + (e.message || 'неверный формат'); }

  function applyImport() {
    if (!sset.imp) return;

    sset.imp = null;
    var ids = ['config'].concat(Object.keys(days).map(function (k) { return 'd_' + k; }), Object.keys(tasks).map(function (id) { return 't_' + id; }),
      Object.keys(next.days).map(function (k) { return 'd_' + k; }), Object.keys(next.tasks).map(function (id) { return 't_' + id; }));

  // ---------- cursor glow (mouse devices only) ----------
  (function () {

    var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0, started = false;
    function loop() {

      if (e.pointerType === 'touch') return;
      tx = e.clientX; ty = e.clientY;
      if (!started) { started = true; cx = tx; cy = ty; }
      glows.forEach(function (g) { g.classList.add('on'); });
      if (!raf) raf = requestAnimationFrame(loop);
    });
    document.documentElement.addEventListener('mouseleave', function () { glows.forEach(function (g) { g.classList.remove('on'); }); });
  })();

  // ---------- midnight rollover ----------
  setInterval(function () {
    var t = todayKey();
    if (t === lastToday) return;
    var wasToday = view === lastToday;
    lastToday = t;
    if (wasToday) view = t;
    if (cfg) { renderAll(); scrollSel(true); }
  }, 30000);

  (function () {
    var el = document.getElementById('intro');
    if (!el) return;
    introHTML = el.outerHTML;
    if (reduce) el.classList.add('still');
    setTimeout(function () { el.classList.add('out'); if (!reduce) revealBlocks(null); setTimeout(function () { el.remove(); }, 500); }, reduce ? 400 : 2400);
  })();
  boot();
})();
</script>
