<title>INND Anchor</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="INND Anchor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
/* Layout: big day counter, a scrolling strip of day squares that fill with colour as the foundation gets done, the foundation checklist, then the user's own categories. One dark "circuit board" look by choice. Every colour except the warm progress steps and the frost is derived from --accent, so changing --accent recolours the whole app. */
:root {
  color-scheme: dark;
  --accent: #3FE0A0;
  --mask: var(--accent);
  --bg: color-mix(in srgb, var(--accent) 3%, #050706);
  --surface: color-mix(in srgb, var(--accent) 7%, #0B0E0D);
  --surface-2: color-mix(in srgb, var(--accent) 11%, #0F1311);
  --line: color-mix(in srgb, var(--accent) 12%, #1C201F);
  --fg: color-mix(in srgb, var(--accent) 6%, #E8ECEB);
  --fg-2: color-mix(in srgb, var(--accent) 14%, #8D9694);
  --ink-on-fill: color-mix(in srgb, var(--accent) 10%, #050706);
  --glow-deep: color-mix(in srgb, var(--accent) 30%, #060C09);
  --lvl1: #C47A47;
  --lvl2: #C9A24A;
  --lvl3: color-mix(in srgb, var(--accent) 60%, var(--lvl2));
  --lvl4: var(--accent);
  --copper: #E39A63;
  --red: #F28068;
  --ice: #9FD6FF;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
}
/* Background: soft glow from the top, static. On mouse devices a second soft glow follows the cursor. */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -10%, var(--glow-deep) 0%, transparent 72%), linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 55%, #000));
}
.glow {
  display: none; position: fixed; left: 0; top: 0; width: 640px; height: 640px; margin: -320px 0 0 -320px;
  border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .5s; will-change: transform;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 17%, transparent) 0%, color-mix(in srgb, var(--accent) 7%, transparent) 35%, transparent 66%);
}
#bgGlow { z-index: -1; }
.glow.on { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .glow { display: block; } }

button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mask); outline-offset: 3px; }

.wrap { max-width: 640px; margin: 0 auto; padding-block: 22px 56px; }
#app { display: flex; flex-direction: column; gap: 26px; }
.pad { padding-inline: 16px; }
.lab { font-family: var(--sans); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-2); }

[hidden] { display: none !important; }
.boot { display: flex; align-items: center; gap: 12px; color: var(--fg-2); font-family: var(--sans); font-size: 13px; padding-block: 40px; }
.boot i { width: 10px; height: 10px; border-radius: 3px; background: var(--mask); animation: blink 1.1s ease-in-out infinite; }
.boot i:nth-child(2) { animation-delay: .15s; } .boot i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

/* head */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-family: var(--mono); font-weight: 500; font-size: clamp(3.6rem, 19vw, 5.6rem); line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.big small { font-size: .28em; letter-spacing: .04em; color: var(--fg-2); font-weight: 400; margin-left: 10px; }
.head-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.date { font-size: 15px; color: var(--fg-2); text-transform: capitalize; text-align: right; }
.head-btns { display: flex; gap: 8px; align-items: center; }
.jump, .btn {
  font-family: var(--sans); font-size: 13px; background: none; border: 1px solid var(--line); border-radius: 8px;
  min-height: 40px; padding: 0 14px; color: var(--fg);
}
.jump:hover, .btn:hover { border-color: var(--mask); color: var(--mask); }
.btn.go { background: var(--mask); border-color: var(--mask); color: var(--ink-on-fill); font-weight: 600; }
.btn.go:hover { color: var(--ink-on-fill); filter: brightness(1.08); }
.btn.big { min-height: 52px; width: 100%; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: default; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.iconbtn:hover { border-color: var(--mask); color: var(--mask); }
.iconbtn svg { width: 20px; height: 20px; }

.notice { border: 1px solid var(--copper); border-radius: 8px; padding: 10px 12px; font-size: 14px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.prestart { border: 1px dashed var(--line); border-radius: 12px; padding: 22px 18px; display: flex; flex-direction: column; gap: 6px; }
.prestart b { font-family: var(--mono); font-weight: 500; font-size: 1.6rem; }

/* strip */
.strip {
  display: flex; gap: 10px; overflow-x: auto; padding: 16px 16px 14px;
  scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.cell { position: relative; flex: none; scroll-snap-align: center; }
.sq {
  position: relative; display: block; width: 64px; height: 76px; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left;
  transition: transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .4s, border-color .3s;
}
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--lvl4); transition: height .7s cubic-bezier(.3,.9,.3,1); }
.fill::before { content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: color-mix(in srgb, #fff 55%, transparent); }
.num { position: absolute; top: 8px; left: 10px; font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fg); transition: color .3s; }
.dt { position: absolute; bottom: 7px; left: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--fg-2); transition: color .3s; }
.cell[data-lvl="1"] .dt, .cell[data-lvl="2"] .dt, .cell[data-lvl="3"] .dt, .cell[data-lvl="4"] .dt { color: var(--ink-on-fill); }
.cell[data-lvl="3"] .num, .cell[data-lvl="4"] .num { color: var(--ink-on-fill); }
.cell[data-lvl="4"] .sq { border-color: var(--lvl4); box-shadow: 0 0 18px color-mix(in srgb, var(--lvl4) 38%, transparent); }
.cell.today .sq { border-color: var(--mask); }
.cell.sel .sq { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.cell.sel[data-lvl="4"] .sq { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg), 0 0 20px color-mix(in srgb, var(--lvl4) 40%, transparent); }
.cell.frozen .sq { border-color: color-mix(in srgb, var(--ice) 80%, transparent); }
.cell.frozen .sq::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(135deg, rgba(190, 232, 255, .30) 0%, rgba(190, 232, 255, .06) 38%, rgba(190, 232, 255, 0) 56%, rgba(190, 232, 255, .22) 100%),
    repeating-linear-gradient(60deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 7px);
  box-shadow: inset 0 0 12px rgba(160, 215, 255, .38);
}
.cell.just .sq::after { animation: frostIn .9s ease-out; }
@keyframes frostIn { from { clip-path: circle(0% at 50% 100%); opacity: 0; } to { clip-path: circle(150% at 50% 100%); opacity: 1; } }
.link { position: absolute; top: 50%; right: -10px; width: 10px; height: 2px; background: var(--lvl4); opacity: 0; transition: opacity .4s .2s; pointer-events: none; }
.cell.linked .link { opacity: 1; }
.cell.pop .sq { animation: pop .55s cubic-bezier(.2,.8,.3,1.3); }
.cell.pop::before { content: ''; position: absolute; inset: 0; border-radius: 12px; border: 2px solid var(--lvl4); animation: ring .8s ease-out forwards; pointer-events: none; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 26%, transparent); } }
.cell.today:not(.sel):not([data-lvl="4"]):not(.frozen) .sq { animation: pulse 2.6s ease-in-out infinite; }

/* sections and lists */
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
h2 { margin: 0; font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; overflow-wrap: anywhere; }
.sec-meta { font-family: var(--mono); font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cat { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.cat:last-child { margin-bottom: 0; }
.item {
  display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; min-height: 60px; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px;
}
.item:disabled { cursor: default; color: var(--fg); }
.item:not(:disabled):hover .box { border-color: var(--mask); }
.box {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center; transition: background-color .25s, border-color .25s;
}
.box svg { width: 18px; height: 18px; }
.box path { fill: none; stroke: var(--ink-on-fill); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; }
.item[aria-checked="true"] .box { background: var(--mask); border-color: var(--mask); }
.item[aria-checked="true"] .box path { stroke-dashoffset: 0; }
.item.anim[aria-checked="true"] .box path { animation: draw .35s ease-out .05s backwards; }
@keyframes draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
.box.x { border-color: var(--red); }
.box.x path { stroke: var(--red); stroke-dasharray: none; stroke-dashoffset: 0; }
.item[data-st="x"] .txt { color: var(--fg-2); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--red) 70%, transparent); }
.item .txt { flex: 1; min-width: 0; font-size: 17px; overflow-wrap: anywhere; transition: color .3s; }
.item[aria-checked="true"] .txt { color: var(--fg-2); }
.item .when { font-family: var(--mono); font-size: 13px; color: var(--fg-2); }
.ico { width: 22px; height: 22px; flex: none; color: var(--fg-2); transition: color .3s; }
.ico-s { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
.item[aria-checked="true"] .ico { color: var(--mask); }
.age { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--copper); border: 1px solid currentColor; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.age.hot { color: var(--red); }
.trow { display: flex; align-items: center; gap: 4px; }
.dots { flex: none; width: 40px; height: 40px; background: none; border: 0; color: var(--fg-2); font-size: 18px; letter-spacing: .1em; border-radius: 8px; }
.dots:hover { color: var(--fg); }
.edit { display: flex; flex-direction: column; gap: 8px; padding: 4px 0 14px 44px; }
.edit-row { display: flex; gap: 14px; flex-wrap: wrap; }
.rename, .addrow input, .field {
  width: 100%; min-width: 0; min-height: 44px; padding: 0 12px;
  background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--line); border-radius: 8px;
}
.rename:focus, .addrow input:focus, .field:focus { border-color: var(--mask); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.addrow { display: flex; gap: 8px; margin-top: 8px; }
.addrow .btn { min-width: 44px; padding: 0 14px; font-size: 18px; }
.link-btn { background: none; border: 0; padding: 6px 2px; color: var(--fg-2); font-size: 13px; text-decoration: underline; align-self: flex-start; }
.link-btn.danger { color: var(--red); }
.empty { color: var(--fg-2); font-size: 15px; max-width: 46ch; margin: 0; }

/* icon picker */
.ipick { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; padding: 4px 0; }
.ic {
  height: 44px; border-radius: 8px; background: none; border: 1px solid var(--line); color: var(--fg-2);
  display: inline-flex; align-items: center; justify-content: center; padding: 0; font-family: var(--mono); font-size: 11px;
}
.ic svg { width: 22px; height: 22px; }
.ic:hover { color: var(--fg); border-color: var(--fg-2); }
.ic[aria-pressed="true"] { color: var(--ink-on-fill); background: var(--mask); border-color: var(--mask); }
.icbtn {
  flex: none; width: 44px; height: 44px; border-radius: 8px; background: none; color: var(--fg); padding: 0;
  border: 1px dashed var(--fg-2); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; color: var(--fg-2);
}
.icbtn.has { border-style: solid; border-color: var(--line); color: var(--fg); }
.icbtn:hover { border-color: var(--mask); color: var(--mask); }
.icbtn svg { width: 22px; height: 22px; }

/* freeze and hold buttons */
.freeze { display: flex; flex-direction: column; gap: 10px; }
.closeday {
  min-height: 52px; border-radius: 10px; font-weight: 600; background: none; color: var(--ice);
  border: 1px solid color-mix(in srgb, var(--ice) 60%, transparent);
}
.closeday:hover { background: color-mix(in srgb, var(--ice) 14%, transparent); }
.frozen-note { display: flex; align-items: center; gap: 10px; color: var(--ice); font-size: 15px; }
.frozen-note svg { width: 20px; height: 20px; flex: none; }
.hold {
  position: relative; overflow: hidden; min-height: 48px; border-radius: 10px; background: none; color: var(--fg); touch-action: none;
  border: 1px solid color-mix(in srgb, var(--ice) 45%, transparent); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.hold i { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--ice) 30%, transparent); transition: width .15s; }
.hold.holding i { width: 100%; transition: width var(--ms, 1.4s) linear; }
.hold span { position: relative; font-size: 15px; }
.hold.danger { border-color: color-mix(in srgb, var(--red) 60%, transparent); }
.hold.danger i { background: color-mix(in srgb, var(--red) 35%, transparent); }
.foot { font-size: 12px; color: var(--fg-2); font-family: var(--sans); display: flex; align-items: center; gap: 8px; }
.foot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mask); flex: none; }
.foot.busy::before { background: var(--copper); }
.foot.err::before { background: var(--red); }
.foot.off::before { background: var(--fg-2); }

/* sheets (30 days, settings) */
.sheet {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto;
  background-color: var(--bg); background-image: radial-gradient(120% 60% at 50% -10%, var(--glow-deep) 0%, transparent 72%); background-repeat: no-repeat;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(100%); visibility: hidden;
  transition: transform .45s cubic-bezier(.2,.9,.3,1), visibility 0s .45s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.2,.9,.3,1), visibility 0s; }
.sheet .glow { z-index: 0; }
.sheet-in { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 22px 16px 56px; display: flex; flex-direction: column; gap: 26px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.mgrid .cell { min-width: 0; }
.mgrid .cell.future .sq { opacity: .35; }
.mgrid .sq { width: 100%; height: auto; aspect-ratio: 1; }
.mgrid .num { font-size: 17px; top: 6px; left: 8px; }
.mgrid .dt { left: 8px; bottom: 6px; }
.mrows { display: flex; flex-direction: column; gap: 18px; }
.mrow-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; margin-bottom: 7px; }
.mrow-h span:first-child { min-width: 0; overflow-wrap: anywhere; }
.mrow-h span:last-child { font-family: var(--mono); font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow { display: grid; gap: 2px; }
.mrow i { display: block; height: 20px; border-radius: 3px; background: var(--surface-2); }
.mrow i.on { background: var(--lvl4); }
.mrow i.na { background: transparent; border: 1px dashed var(--line); }

.sset { display: flex; flex-direction: column; gap: 12px; }
.srow { display: flex; gap: 8px; align-items: center; }
.srow .field { flex: 1; }
.srow .tfield { width: 100px; flex: none; }
.hint { margin: 0; font-size: 13px; color: var(--fg-2); max-width: 52ch; }
.delpanel { border: 1px solid var(--red); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.delpanel p { margin: 0; }
.delpanel .srow { flex-wrap: wrap; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.file-btn { position: relative; overflow: hidden; align-self: flex-start; display: inline-flex; align-items: center; cursor: pointer; }
.file-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.sw {
  position: relative; width: 44px; height: 44px; border-radius: 10px; padding: 0; background: var(--c, var(--accent));
  border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
}
.sw[aria-pressed="true"] { border-color: var(--bg); box-shadow: 0 0 0 2px var(--fg); }
.sw.custom { background: conic-gradient(#ff6b6b, #ffd93d, #6bff95, #4dd4ff, #a78bfa, #ff6bd5, #ff6b6b); color: #07120C; font-weight: 700; cursor: pointer; }
.sw.custom.on { box-shadow: 0 0 0 2px var(--fg); border-color: var(--bg); }
.sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw.custom span { pointer-events: none; font-size: 20px; line-height: 1; text-shadow: 0 0 6px rgba(255, 255, 255, .6); }

/* first-run wizard */
.wiz {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto;
  background-color: var(--bg); background-image: radial-gradient(120% 60% at 50% -10%, var(--glow-deep) 0%, transparent 72%); background-repeat: no-repeat;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wiz .glow { z-index: 0; }
.wiz-in { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; min-height: 100%; }
.wiz-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.wdots { display: flex; gap: 8px; }
.wd { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.wd::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--lvl4); transition: height .5s cubic-bezier(.3,.9,.3,1); }
.wd.on::after { height: 100%; }
.wh { margin: 0; font-size: clamp(1.7rem, 7vw, 2.3rem); line-height: 1.12; font-weight: 600; text-wrap: balance; }
.wp { margin: 0; color: var(--fg-2); max-width: 46ch; }
.wprev { font-family: var(--sans); font-size: 15px; color: var(--mask); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { font-family: var(--sans); font-size: 13px; background: none; border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 16px; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.frows { display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; gap: 8px; align-items: center; }
.frow .field { flex: 1; }
.frow .tfield { width: 100px; flex: none; }
.rm { flex: none; width: 44px; height: 44px; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--fg-2); font-size: 18px; }
.rm:hover { color: var(--red); border-color: var(--red); }
.err { color: var(--red); font-size: 14px; margin: 0; min-height: 1.3em; }
.wiz-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }

/* assistant: floating mic and its sheet */
.botfab {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--mask); color: var(--ink-on-fill); box-shadow: 0 8px 28px color-mix(in srgb, var(--accent) 35%, transparent);
}
.botfab[hidden] { display: none; }
.botfab:hover { filter: brightness(1.08); }
.botfab svg { width: 26px; height: 26px; }
.bot-log { display: flex; flex-direction: column; gap: 10px; min-height: 96px; }
.bot-me { font-family: var(--sans); font-size: 13px; color: var(--fg-2); overflow-wrap: anywhere; }
.bot-say { font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
.bot-res { margin: 0; font-size: 14px; color: var(--mask); padding-left: 12px; border-left: 2px solid var(--mask); overflow-wrap: anywhere; }
.bot-in { display: flex; gap: 8px; align-items: center; }
.bot-in .field { flex: 1; min-width: 0; }
.bot-in .btn { min-width: 52px; min-height: 44px; font-size: 18px; padding: 0 12px; }
#botMic.rec { color: var(--ink-on-fill); background: var(--mask); border-color: var(--mask); animation: recPulse 1.2s ease-in-out infinite; }
@keyframes recPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }

@media (max-width: 420px) {
  .srow .tfield, .frow .tfield { width: 92px; }
}
@media (prefers-reduced-motion: reduce) {
  .fill, .sq, .box, .link, .num, .dt, .sheet, .wd::after { transition: none; }
  .cell.pop .sq, .cell.pop::before, .cell.today .sq, .item.anim .box path, .cell.just .sq::after, .boot i { animation: none !important; }
}
.item.late .when { color: #E8C35A; }
.star { color: var(--accent); margin-right: 6px; }
.atrow { padding: 0 0 10px 44px; font-size: 13px; color: var(--fg-2); }
.atrow label { display: inline-flex; align-items: center; gap: 10px; }
.atin { width: auto; min-height: 34px; padding: 4px 8px; }
.goal { margin: 0 0 8px; font-size: 14px; color: var(--fg-2); }
.note textarea { min-height: 84px; resize: vertical; }
.fin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.fin-list li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; }
.fin-list li.no { color: var(--fg-2); }
.fin-list .dt { font-family: var(--mono); font-size: 12px; color: var(--fg-2); white-space: nowrap; min-width: 46px; }
.lfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: #E8C35A; transition: height .7s cubic-bezier(.3,.9,.3,1), bottom .7s cubic-bezier(.3,.9,.3,1); }
.item .box.late { background: #E8C35A; border-color: #E8C35A; }
.mrow i.late { background: #E8C35A; }
.wiz-welcome { display: flex; flex-direction: column; gap: 28px; margin-top: 16vh; flex: 1; }
.wiz-help { position: absolute; inset: 0; z-index: 5; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.wiz-help > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
#wGoal { min-height: 90px; resize: vertical; }
.startfx { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; animation: fxIn .3s ease-out both; transition: opacity .6s ease; }
.startfx.out { opacity: 0; }
.startfx-sq { width: 150px; height: 180px; border-radius: 22px; border: 2px solid var(--accent); box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 10px; animation: fxSq 1.8s cubic-bezier(.2,.8,.3,1) both; }
.startfx-num { font-family: var(--sans); font-size: 26px; font-weight: 600; letter-spacing: 0; color: var(--accent); white-space: nowrap; opacity: 0; animation: fxNum .5s ease-out 1s forwards; }
@keyframes fxIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fxSq { from { transform: scale(.6); opacity: 0; } 40% { transform: scale(1); opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes fxNum { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.intro { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; align-items: center; justify-content: center; transition: opacity .45s ease; }
.intro.out { opacity: 0; pointer-events: none; }
.intro-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.intro-wrap { transition: filter .5s ease; }
.intro.out .intro-wrap { filter: blur(12px); }
.intro-mask { width: min(62vw, 420px); overflow: hidden; }
.intro-logo { width: 100%; height: auto; display: block; transform: translateY(101%); will-change: transform; animation: introUp .9s cubic-bezier(.3,.7,.2,1) .15s forwards; }
.intro-sub { align-self: flex-start; font-family: var(--sans); font-weight: 300; font-size: 15px; letter-spacing: .16em; color: rgba(255,255,255,.72); opacity: 0; animation: introSub .6s ease 1.05s forwards; }
.intro.still .intro-logo { transform: none; animation: none; }
.intro.still .intro-sub { opacity: 1; animation: none; }
@keyframes introUp { to { transform: translateY(0); } }
@keyframes introSub { to { opacity: 1; } }
</style>

  $('#setBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-s]');
    if (!b) return;
    var s = b.dataset.s, t = todayKey();
    sset.msg = '';
    function validIcon(k) { return k && Object.prototype.hasOwnProperty.call(ICONS, k) ? k : ''; }
    if (s === 'theme') {
      cfg.theme = { accent: b.dataset.c };
      applyTheme(b.dataset.c);
      touch('config');
      renderSettings();
    } else if (s === 'start-save') {
      var v = $('#sStart').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { sset.msg = 'Выбери дату.'; renderSettings(); return; }
      var old = cfg.start;
      cfg.foundation.forEach(function (f) { if (f.from === old) f.from = v; });
      cfg.start = v;
      if (view < v) view = t;
      touch('config');
      sset.msg = 'Дата старта сохранена.';
      renderAll(); renderSettings();
    } else if (s === 'final-open') {
      closeSheet();
      openSheet($('#finalSheet'), $('#openSet'));
    } else if (s === 'imp-parse') {
      var raw = $('#impText').value.trim();
      sset.impName = '';
      try { sset.imp = parseImport(JSON.parse(raw)); sset.msg = ''; }
      catch (err) { sset.imp = null; sset.msg = 'Не получилось прочитать текст: ' + (err.message || 'неверный формат'); }
      renderSettings();
    } else if (s === 'f-icon') {
      var fid0 = b.closest('[data-fid]').dataset.fid;
      sset.iconFor = sset.iconFor === fid0 ? null : fid0;
      renderSettings();
    } else if (s === 'f-pick') {
      var fi = cfg.foundation.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (fi) { var ik = validIcon(b.dataset.icon); if (ik) fi.icon = ik; else delete fi.icon; touch('config'); }
      sset.iconFor = null;
      renderAll(); renderSettings();
    } else if (s === 'nf-icon') {
      sset.iconFor = sset.iconFor === 'new' ? null : 'new';
      renderSettings();
    } else if (s === 'nf-pick') {
      sset.newIcon = validIcon(b.dataset.icon);
      sset.iconFor = null;
      renderSettings();
    } else if (s === 'f-rm') { sset.rmF = b.closest('[data-fid]').dataset.fid; renderSettings(); }
    else if (s === 'f-rm-no') { sset.rmF = null; renderSettings(); }
    else if (s === 'f-rm-yes') {
      var f = cfg.foundation.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (f) {
        if (f.from >= t) cfg.foundation = cfg.foundation.filter(function (x) { return x !== f; });
        else f.to = addDays(t, -1);
      }
      sset.rmF = null;
      touch('config');
      renderAll(); renderSettings();
    } else if (s === 'f-add') {
      var title = $('#nfTitle').value.trim();
      if (!title) { $('#nfTitle').focus(); return; }
      if (cfg.foundation.filter(function (x) { return !x.to; }).length >= MAXF) return;
      var item = { id: uid(), title: title, time: $('#nfTime').value || '', from: t > cfg.start ? t : cfg.start, to: null };
      if (sset.newIcon) item.icon = sset.newIcon;
      cfg.foundation.push(item);
      sset.newIcon = '';
      touch('config');
      renderAll(); renderSettings();
    } else if (s === 'c-add') {
      var ct = $('#ncTitle').value.trim();
      if (!ct) { $('#ncTitle').focus(); return; }
      if (cfg.categories.length >= MAXC) return;
      cfg.categories.push({ id: uid(), title: ct });
      touch('config');
      renderAll(); renderSettings();
    } else if (s === 'c-del') { sset.delCat = b.closest('[data-cid]').dataset.cid; renderSettings(); }
    else if (s === 'c-del-no') { sset.delCat = null; renderSettings(); }
    else if (s === 'c-del-all') {
      removeCategory(b.dataset.id, '');
      sset.delCat = null;
      renderAll(); renderSettings();
    } else if (s === 'export') {
      var payload = JSON.stringify({ exportedAt: new Date().toISOString(), config: cfg, days: days, tasks: tasks }, null, 2);
      var fname = 'fundament-' + t + '.json';
      if (downloads) { downloads.save({ filename: fname, data: payload }).catch(function () {}); }
      else {
        var url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
        var a = document.createElement('a'); a.href = url; a.download = fname;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
    }
  });
  $('#setBody').addEventListener('input', function (e) {
    if (e.target.id !== 'sColor') return;
    var hex = clampAccent(e.target.value);
    cfg.theme = { accent: hex };
    applyTheme(hex);
  });
  $('#setBody').addEventListener('change', function (e) {
    if (e.target.id === 'impFile') { readImport(e.target.files[0]); return; }
    if (e.target.id === 'sColor') {
      var hex = clampAccent(e.target.value);
      cfg.theme = { accent: hex };
      applyTheme(hex);
      touch('config');
      renderSettings();
      return;
    }
    var el = e.target.closest('[data-s-change]');
    if (!el) return;
    var row = el.closest('[data-fid],[data-cid]');
    var kind = el.dataset.sChange;
    if (kind === 'f-title' || kind === 'f-time') {
      var f = cfg.foundation.filter(function (x) { return x.id === row.dataset.fid; })[0];
      if (!f) return;
      if (kind === 'f-title') { var v = el.value.trim(); if (!v) { el.value = f.title; return; } f.title = v; }
      else f.time = el.value || '';
      touch('config');
      refreshMain();
    } else if (kind === 'goal-text') {
      cfg.goal = { text: el.value.trim().slice(0, 200), days: goalOf().days };
      touch('config'); renderAll();
    } else if (kind === 'goal-days') {
      var gd = Math.max(1, Math.min(365, Math.round(+el.value) || 100));
      cfg.goal = { text: goalOf().text, days: gd };
      el.value = gd; touch('config'); renderAll();
    } else if (kind === 'c-title') {
      var c = cfg.categories.filter(function (x) { return x.id === row.dataset.cid; })[0];
      if (!c) return;
      var cv = el.value.trim();
      if (!cv) { el.value = c.title; return; }
      c.title = cv;
      touch('config');
      refreshMain();
    }
  });
  $('#setBody').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'nfTitle') { e.preventDefault(); var b = $('#setBody [data-s="f-add"]'); if (b) b.click(); }
    if (e.target.id === 'ncTitle') { e.preventDefault(); var b2 = $('#setBody [data-s="c-add"]'); if (b2) b2.click(); }
  });

    $('#botMic').classList.add('rec');
    botHint('Слушаю… нажми ещё раз, чтобы закончить');
    try { rec.start(); } catch (e) { botRecOn = false; $('#botMic').classList.remove('rec'); botHint('Не получилось включить микрофон.'); }
  }

  $('#botBtn').addEventListener('click', function () { openSheet($('#botSheet'), $('#botBtn')); botRender(); });
  $('#botForm').addEventListener('submit', function (e) { e.preventDefault(); botAsk($('#botText').value); });
  $('#botMic').addEventListener('click', botMic);
  $('#botPending').addEventListener('click', function (e) {
    var b = e.target.closest('[data-bot]');
    if (!b) return;
    var i = Number(b.dataset.i), a = botPending[i];
    if (!a) return;
    botPending.splice(i, 1);
    if (b.dataset.bot === 'yes') { botLast.results = botLast.results.concat([botRun(a)]); renderAll(); }
    botRender();
  });
  if (!SR) $('#botMic').hidden = true;

  // ---------- import: a file with history replaces all data ----------
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function parseImport(o) {
    if (!o || typeof o !== 'object' || !DATE_RE.test(o.start)) throw new Error('нет даты старта (start)');
    var fl = Array.isArray(o.foundation) ? o.foundation.slice(0, MAXF) : [];
    if (!fl.length) throw new Error('нет пунктов фундамента');
    var t0 = todayKey();
    var gIn = o.goal && typeof o.goal === 'object' ? o.goal : {};
    var c = { v: 1, start: o.start, theme: { accent: (cfg && cfg.theme && cfg.theme.accent) || DEFAULT_ACCENT }, foundation: [], categories: [], goal: { text: String(gIn.text || '').slice(0, 200), days: (+gIn.days) || 100 }, finalFor: null };
    var fId = {}, cId = {};
    fl.forEach(function (f) {
      var title = String(f.title || '').trim().slice(0, 80);
      if (!title) return;
      var item = { id: uid(), title: title, time: TIME_RE.test(f.time) ? f.time : '', from: o.start, to: null };
      if (f.icon && Object.prototype.hasOwnProperty.call(ICONS, f.icon)) item.icon = f.icon;
      fId[title] = item.id;
      c.foundation.push(item);
    });
    (Array.isArray(o.categories) ? o.categories : []).slice(0, MAXC).forEach(function (x) {
      var title = String(x.title || '').trim().slice(0, 40);
      if (!title) return;
      var id = uid(); cId[title] = id;
      c.categories.push({ id: id, title: title });
    });
    var nd = {}, nt = {}, n = 0;
    Object.keys(o.days || {}).sort().forEach(function (k) {
      if (!DATE_RE.test(k) || k < o.start || k >= t0) return;
      var day = o.days[k] || {}, done = {};
      (Array.isArray(day.done) ? day.done : []).forEach(function (title) { if (fId[title]) done[fId[title]] = true; });
      // missed foundation items (the cross) and a free-text note for the day
      var miss = {};
      (Array.isArray(day.missed) ? day.missed : []).forEach(function (title) { if (fId[title]) miss[fId[title]] = ''; });
      // actual times of foundation items done on that day (a late item shows yellow)
      var atIn = day.at && typeof day.at === 'object' ? day.at : {}, at = {};
      Object.keys(atIn).forEach(function (title) { if (fId[title] && done[fId[title]] && TIME_RE.test(atIn[title])) at[fId[title]] = atIn[title]; });
      nd[k] = { done: done, frozen: true, thawed: false, miss: miss, at: at, note: typeof day.note === 'string' ? day.note.slice(0, 5000) : '' };
      (Array.isArray(day.tasks) ? day.tasks : []).forEach(function (t) {
        var title = String(t.title || '').trim().slice(0, 200);
        if (!title) return;
        var on = DATE_RE.test(t.doneOn) && t.doneOn >= k && t.doneOn < t0 ? t.doneOn : null;
        var rec = { title: title, cat: cId[t.category] || '', born: k, doneDay: on, doneAt: on ? Date.parse(on + 'T12:00:00') : null, at: ++n };
        if (t.icon && Object.prototype.hasOwnProperty.call(ICONS, t.icon)) rec.icon = t.icon;
        if (t.star === true) rec.star = true;
        nt[uid()] = rec;
      });
    });
    var days_n = Object.keys(nd).length, tasks_n = Object.keys(nt).length;
    return {
      next: { cfg: c, days: nd, tasks: nt },
      summary: 'Дней: ' + days_n + ', задач: ' + tasks_n + ', пунктов фундамента: ' + c.foundation.length + ', категорий: ' + c.categories.length + '. Проверь и зажми кнопку ниже.'
    };
  }
  function readImport(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      sset.impName = file.name;
      try { sset.imp = parseImport(JSON.parse(String(fr.result))); sset.msg = ''; }
      catch (e) { sset.imp = null; sset.msg = 'Не получилось прочитать файл: ' + (e.message || 'неверный формат'); }
      renderSettings();
    };
    fr.readAsText(file);
  }
  function applyImport() {
    if (!sset.imp) return;
    var next = sset.imp.next;
    sset.imp = null;
    var ids = ['config'].concat(Object.keys(days).map(function (k) { return 'd_' + k; }), Object.keys(tasks).map(function (id) { return 't_' + id; }),
      Object.keys(next.days).map(function (k) { return 'd_' + k; }), Object.keys(next.tasks).map(function (id) { return 't_' + id; }));
    ids = ids.filter(function (v, i, a) { return a.indexOf(v) === i; });
    // Nothing waits for the database here: every id is marked dirty, so echoes of old values are ignored
    // until their own saves finish. The screen never gets stuck on "стираю данные".
    cfg = next.cfg; days = next.days; tasks = next.tasks;
    Object.keys(cellMap).forEach(function (k) { cellMap[k].remove(); });
    cellMap = {};
    openTask = null; pendingDel = null; iconTask = null;
    sset = { rmF: null, delCat: null, iconFor: null, newIcon: '', msg: 'История загружена.', impName: '' };
    view = todayKey();
    ids.forEach(function (id) { rev[id] = (rev[id] || 0) + 1; dirty.add(id); flush(id); });
    renderAll();
  }

  // ---------- cursor glow (mouse devices only) ----------
  (function () {
    var fine = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (!fine || reduce) return;
    var glows = document.querySelectorAll('.glow');
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0, started = false;
    function loop() {
      cx += (tx - cx) * 0.14; cy += (ty - cy) * 0.14;
      glows.forEach(function (g) { g.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)'; });
      raf = (Math.abs(tx - cx) > 0.4 || Math.abs(ty - cy) > 0.4) ? requestAnimationFrame(loop) : 0;
    }
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      tx = e.clientX; ty = e.clientY;
      if (!started) { started = true; cx = tx; cy = ty; }
      glows.forEach(function (g) { g.classList.add('on'); });
      if (!raf) raf = requestAnimationFrame(loop);
    });
    document.documentElement.addEventListener('mouseleave', function () { glows.forEach(function (g) { g.classList.remove('on'); }); });
  })();

  // ---------- midnight rollover ----------
  setInterval(function () {
    var t = todayKey();
    if (t === lastToday) return;
    var wasToday = view === lastToday;
    lastToday = t;
    if (wasToday) view = t;
    if (cfg) { renderAll(); scrollSel(true); }
  }, 30000);

  (function () {
    var el = document.getElementById('intro');
    if (!el) return;
    if (reduce) el.classList.add('still');
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }, reduce ? 400 : 2400);
  })();
  boot();
})();
</script>
